name: Publish build and ML image

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        project: [llama.cpp]
        variant: [cuda, vulkan, cpu]
        architecture: [amd64, arm64]
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # The CUDA devel image needs more space to unpack than a stock runner has free.
      - name: Free disk space for CUDA image
        if: matrix.variant == 'cuda'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache \
            /usr/local/.ghcup /usr/local/share/powershell
          docker image prune --all --force
          df -h /

      # Build on native runners rather than emulating ARM64 with QEMU.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.project }}.${{ matrix.variant }}.Dockerfile
          platforms: linux/${{ matrix.architecture }}
          tags: ${{ steps.image.outputs.name }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.project }}-${{ matrix.variant }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        project: [llama.cpp]
        variant: [cuda, vulkan, cpu]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.project }}-${{ matrix.variant }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform tags
        env:
          PROJECT: ${{ matrix.project }}
          VARIANT: ${{ matrix.variant }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(--tag "$image:$PROJECT-$VARIANT" --tag "$image:$PROJECT-$VARIANT-sha-$GITHUB_SHA")
          # Preserve the original llama.cpp tags without colliding with future projects.
          if [[ "$PROJECT" == llama.cpp ]]; then
            tags+=(--tag "$image:$VARIANT" --tag "$image:$VARIANT-sha-$GITHUB_SHA")
            if [[ "$VARIANT" == cuda ]]; then
              tags+=(--tag "$image:latest" --tag "$image:sha-$GITHUB_SHA")
            fi
          fi
          sources=()
          for digest in "$RUNNER_TEMP"/digests/*; do
            sources+=("$image@sha256:$(basename "$digest")")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Verify published architectures
        env:
          PROJECT: ${{ matrix.project }}
          VARIANT: ${{ matrix.variant }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools inspect "$image:$PROJECT-$VARIANT-sha-$GITHUB_SHA" --raw |
            jq --exit-status '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
