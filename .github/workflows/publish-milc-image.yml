name: Publish MILC CPU image

on:
  push:
    branches: [master]
    paths:
      - milc/**
      - "!milc/results/**"
      - "!milc/README.md"
      - .github/workflows/publish-milc-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # x86-64 only: the flag catalog uses x86 -march levels.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: milc
          file: milc/Dockerfile.cpu
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:milc-cpu
            ${{ steps.image.outputs.name }}:milc-cpu-sha-${{ github.sha }}
